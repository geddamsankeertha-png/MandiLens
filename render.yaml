services:
  - type: web
    name: kisanmandi-platform
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Set these in the Render dashboard. For Gmail, SMTP_PASS must be an App Password.
      - key: APP_BASE_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
